<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title>TD 2 - Formulaire de connexion</title>
		<link rel="stylesheet" type="text/css" href="enregistrement.css">
	</head>
	<body>
		<h1>Enregistrement</h1>
		<form method="POST" action="javascript:connexion" >
			<div class="name">
				<div class="prenom">
					<label for="prenom">Prénom</label>
				<input id="prenom" name="prenom" type="text" required>
				</div>
				<div>
				<div class="nom">
					<label for="nom">Nom</label>
					<input id="nom" name="nom" type="text" required>
				</div>
				</div> 
			</div>
			

			<div class="field">
				<label for="login">Login</label>
				<input id="login" name="username" type="text" required>
			</div>
			
			<div class="field">
				<label for="password">Mot de passe</label>
				<input id="password" name="password" type="password" required>
			</div>

			<div class="field">
				<label for="retapez">Retapez</label>
				<input id="retapez" name="password" type="password" required>
			</div>
			
			<div class="actions">
				<button type="submit">Enregistrer</button>
				<button type="reset">Annuler</button>
			</div>
		</form>
	</body>
</html>
