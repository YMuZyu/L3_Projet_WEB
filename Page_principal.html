<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<title>TME 2 - Page principale</title>
		<link rel="stylesheet" type="text/css" href="Page_principal.css">
		 <h1>Forum</h1>
	</head>
    <body>
		<header class="Header">
			<h2>Header</h2>

			<div id="logo">
				<img src="logo.png" alt="Logo du forum">
			</div>

			<div id="search">
				<input type="text" placeholder="Zone Recherche">
				<button type="submit">Recherche</button>
			</div>

			<div id="lien-connexion">
				<a href="connexion.html">Connexion</a>
			</div>

			<div id="lien-deconnexion">
				<a href="#">Déconnexion</a>
			</div>
			
		</header>
		<hr>

		<section class="main-content">
			<h2>Contenu Principal</h2>
			<form method="POST" action="javascript:envoyerMessage">
			</form>
			<div class="new-msg">
				<input id="nouveau_message" name="nouveau_message" type="text" placeholder="Nouveau message">
				<button type="submit">Envoyer</button>
			</div>

			<div class="Liste-des-messages">
				<ul id="liste-message" class="liste-message">
					<!-- en attente de js pour remplir li de la liste -->
				</ul>
			</div>

			<h2>Informations</h2>
		</section>

	</body>
</html>
